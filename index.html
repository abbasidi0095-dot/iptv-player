<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>abba TV - IPTV Player</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📺</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #08080e;
    --surface: #12121e;
    --surface2: #1a1a2e;
    --surface3: #22223a;
    --primary: #ff4d6d;
    --primary-dim: rgba(255, 77, 109, 0.15);
    --accent: #7c3aed;
    --accent-dim: rgba(124, 58, 237, 0.15);
    --text: #eeeef5;
    --text2: #8888a0;
    --text3: #5a5a70;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
  .app { display: flex; flex-direction: column; height: 100vh; }

  header {
    padding: 12px 24px; background: var(--surface); display: flex; align-items: center;
    gap: 12px; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.04);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .logo {
    font-size: 22px; font-weight: 800; letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    display: flex; align-items: center; gap: 8px;
  }
  .logo span { font-size: 20px; -webkit-text-fill-color: initial; }
  header .sub { font-size: 11px; color: var(--text3); margin-left: auto; letter-spacing: 0.3px; }

  .player-wrap { position: relative; background: #000; flex-shrink: 0; }
  .player-wrap video { width: 100%; display: block; max-height: 45vh; background: #000; }
  .player-placeholder {
    width: 100%; max-height: 45vh; aspect-ratio: 16/9; display: flex;
    align-items: center; justify-content: center; background:
      radial-gradient(ellipse at center, #1a1a2e 0%, #08080e 100%);
    color: var(--text2); font-size: 14px; flex-direction: column; gap: 12px;
  }
  .player-placeholder .icon-wrap {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--primary-dim); display: flex; align-items: center;
    justify-content: center; margin-bottom: 4px;
  }
  .player-placeholder svg { opacity: 0.6; color: var(--primary); }

  .now-playing {
    padding: 10px 24px; background: var(--surface);
    font-size: 13px; color: var(--text2); flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    min-height: 42px;
  }
  .now-playing .np-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--primary);
    flex-shrink: 0; display: none;
  }
  .now-playing.playing .np-dot { display: block; animation: pulse-dot 1.5s ease-in-out infinite; }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .now-playing .np-label { color: var(--text3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .now-playing .np-name { color: var(--text); font-weight: 500; }
  .now-playing .np-flag { font-size: 14px; }
  .now-playing .np-err { color: var(--primary); }

  .controls {
    padding: 10px 24px; background: var(--surface2);
    display: flex; gap: 10px; align-items: center; flex-shrink: 0; flex-wrap: wrap;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }
  .tabs {
    display: flex; gap: 4px; background: var(--surface);
    padding: 3px; border-radius: 10px; flex-shrink: 0;
  }
  .tab {
    padding: 6px 16px; border-radius: 8px; border: none; background: transparent;
    color: var(--text2); font-size: 13px; font-weight: 500; cursor: pointer;
    transition: all .2s; white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--primary); color: #fff; }
  .tab.active.cat { background: var(--accent); }
  .tab.active.pin-tab { background: #eab308; color: #000; }
  .channel.pinned { border-color: rgba(234,179,8,0.2); background: linear-gradient(135deg, rgba(234,179,8,0.06), transparent); }
  .channel.pinned .ch-name::before { content: '📌 '; font-size: 11px; }
  .controls select {
    padding: 8px 12px; border-radius: var(--radius-sm); border: 1px solid rgba(255,255,255,0.06);
    background: var(--surface); color: var(--text); font-size: 13px; outline: none;
    min-width: 150px; max-width: 220px; cursor: pointer;
    transition: border-color .2s; flex-shrink: 0;
  }
  .controls select:focus { border-color: var(--primary); }
  .controls select option { background: var(--surface); color: var(--text); }
  .controls input {
    padding: 8px 12px 8px 34px; border-radius: var(--radius-sm);
    border: 1px solid rgba(255,255,255,0.06); background: var(--surface);
    color: var(--text); font-size: 13px; outline: none; flex: 1; min-width: 100px;
    transition: border-color .2s;
  }
  .controls input:focus { border-color: var(--primary); }
  .controls input::placeholder { color: var(--text3); }
  .search-wrap { position: relative; flex: 1; min-width: 100px; }
  .search-wrap .search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text3); pointer-events: none; font-size: 14px;
  }
  .controls .count { font-size: 12px; color: var(--text3); margin-left: auto; white-space: nowrap; }

  .channels { flex: 1; overflow-y: auto; padding: 16px 24px 24px; }
  .channels::-webkit-scrollbar { width: 5px; }
  .channels::-webkit-scrollbar-track { background: transparent; }
  .channels::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
  .channels::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

  .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 6px; }

  .channel {
    padding: 10px 14px; background: var(--surface);
    border-radius: var(--radius-sm); cursor: pointer;
    transition: all .18s ease;
    border: 1px solid rgba(255,255,255,0.04);
    display: flex; align-items: center; gap: 12px;
    position: relative; overflow: hidden;
  }
  .channel::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, var(--primary-dim), transparent 60%);
    opacity: 0; transition: opacity .2s;
  }
  .channel:hover { border-color: rgba(255,77,109,0.2); transform: translateY(-1px); }
  .channel:hover::before { opacity: 1; }
  .channel.active {
    border-color: var(--primary); box-shadow: 0 0 20px rgba(255,77,109,0.08);
  }
  .channel.active::before { opacity: 1; }

  .channel .ch-logo {
    width: 38px; height: 38px; border-radius: var(--radius-sm);
    flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; position: relative; overflow: hidden;
    background: var(--surface3); z-index: 1;
  }
  .channel .ch-logo img {
    width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-sm);
  }
  .channel .ch-logo .fallback {
    font-size: 16px; font-weight: 700; color: var(--text2);
  }

  .channel .ch-info { flex: 1; min-width: 0; z-index: 1; }
  .channel .ch-name { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .channel .ch-meta { font-size: 11.5px; color: var(--text2); margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .channel .ch-meta .flag { font-size: 13px; }
  .channel .ch-badge {
    font-size: 9.5px; padding: 1px 7px; border-radius: 4px;
    background: var(--surface3); color: var(--text2); letter-spacing: 0.2px;
    text-transform: uppercase; font-weight: 600;
  }
  .channel .ch-badge.cat-badge { background: var(--accent-dim); color: #a78bfa; }

  .channel .ch-play {
    width: 30px; height: 30px; border-radius: 50%; border: none;
    background: var(--primary); color: #fff; cursor: pointer; font-size: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; opacity: 0; transition: all .2s; z-index: 1;
  }
  .channel:hover .ch-play { opacity: 1; }
  .channel.active .ch-play { opacity: 1; background: var(--accent); }
  .channel .ch-play:hover { transform: scale(1.1); }

  .spinner {
    width: 28px; height: 28px; border: 3px solid var(--text3);
    border-top-color: var(--primary); border-radius: 50%;
    animation: spin .7s linear infinite; margin: 50px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .state-msg {
    text-align: center; padding: 60px 20px; color: var(--text2);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .state-msg .state-icon { font-size: 32px; opacity: 0.4; }
  .state-msg .state-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .state-msg .state-sub { font-size: 13px; color: var(--text3); max-width: 380px; line-height: 1.5; }

  .error-msg { text-align: center; padding: 20px; color: var(--primary); font-size: 13px; }

  @media (max-width: 640px) {
    header { padding: 10px 16px; }
    .logo { font-size: 18px; }
    header .sub { font-size: 10px; }
    .controls { padding: 8px 12px; gap: 8px; }
    .controls select { min-width: 100px; max-width: 140px; }
    .channels { padding: 10px 12px 16px; }
    .channel-grid { grid-template-columns: 1fr; }
    .tab { padding: 5px 12px; font-size: 12px; }
    .now-playing { padding: 8px 12px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><span>📺</span> abba TV</div>
    <span class="sub">powered by iptv-org</span>
  </header>

  <div class="player-wrap">
    <video id="video" controls autoplay playsinline style="display:none"></video>
    <div class="player-placeholder" id="placeholder">
      <div class="icon-wrap">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </div>
      <span>Select a channel to start watching</span>
    </div>
  </div>

  <div class="now-playing" id="nowPlaying">
    <span class="np-dot"></span>
    <span class="np-label">Not Playing</span>
    <span class="np-flag" id="npFlag"></span>
    <span class="np-name" id="npName">Select a channel</span>
  </div>

  <div class="controls">
    <div class="tabs" id="tabs">
      <button class="tab active" data-mode="country">🌍 Countries</button>
      <button class="tab cat" data-mode="category">📂 Categories</button>
      <button class="tab pin-tab" data-mode="pins">📌 Pins</button>
      <button class="tab" data-mode="custom">📦 Custom</button>
      <button class="tab" data-mode="sports">⚽ Sports</button>
    </div>
    <select id="sourceSelect"><option value="">Loading...</option></select>
    <button id="addPinBtn" title="Add custom stream" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:4px 6px;border-radius:6px;transition:all .15s;flex-shrink:0" onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--text3)'">＋</button>
    <select id="sportsSelect" style="display:none;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.06);background:var(--surface);color:var(--text);font-size:13px;outline:none;cursor:pointer;flex-shrink:0">
      <option value="all">🏅 All Sports</option>
      <option value="soccer">⚽ Soccer</option>
      <option value="nfl">🏈 NFL</option>
      <option value="nba">🏀 NBA</option>
      <option value="nhl">🏒 NHL</option>
    </select>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="Search channels..." />
    </div>
    <span class="count" id="channelCount">0</span>
  </div>

  <div id="customLoader" style="display:none;padding:10px 24px;background:var(--surface);gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid rgba(255,255,255,0.04)" class="custom-loader">
    <input id="customUrlInput" type="text" placeholder="M3U playlist URL..." style="flex:1;min-width:200px;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:var(--surface2);color:var(--text);font-size:13px;outline:none">
    <button id="loadCustomBtn" style="padding:8px 16px;border-radius:8px;border:none;background:var(--primary);color:#fff;cursor:pointer;font-size:13px;font-weight:600">Load</button>
    <select id="customPreset" style="padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:var(--surface2);color:var(--text);font-size:13px;outline:none;cursor:pointer">
      <option value="">📋 Presets...</option>
      <option value="https://gist.githubusercontent.com/regragi-younes/a77b56c45b3c086cc166b79d5cc45e4a/raw/beinsport.m3u">🏆 BeIN Sports & Arabic (131 channels)</option>
    </select>
  </div>

  <div id="addPinModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(4px)" onclick="if(event.target===this)closePinModal()">
    <div style="background:var(--surface2);border-radius:var(--radius);padding:24px;width:90%;max-width:420px;border:1px solid rgba(255,255,255,0.06)" onclick="event.stopPropagation()">
      <h3 style="font-size:16px;font-weight:600;margin-bottom:16px">Add Custom Stream</h3>
      <input id="pinNameInput" placeholder="Channel name (e.g. beIN Sports AFC 1)" style="width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.06);background:var(--surface);color:var(--text);font-size:13px;outline:none;margin-bottom:10px">
      <input id="pinUrlInput" placeholder="Stream URL (e.g. https://...)" style="width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.06);background:var(--surface);color:var(--text);font-size:13px;outline:none;margin-bottom:10px">
      <input id="pinIdInput" placeholder="Stream ID / tvg-id (optional)" style="width:100%;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.06);background:var(--surface);color:var(--text);font-size:13px;outline:none;margin-bottom:16px">
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button onclick="closePinModal()" style="padding:8px 16px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--text2);cursor:pointer;font-size:13px">Cancel</button>
        <button onclick="addPin()" style="padding:8px 16px;border-radius:var(--radius-sm);border:none;background:var(--primary);color:#fff;cursor:pointer;font-size:13px;font-weight:600">Add Stream</button>
      </div>
    </div>
  </div>

  <div class="channels" id="channelList">
    <div class="state-msg">
      <div class="state-icon">🌍</div>
      <div class="state-title">Welcome to abba TV</div>
      <div class="state-sub">Select a country or category above to browse available channels</div>
    </div>
  </div>
</div>

<script>
const DB = 'https://raw.githubusercontent.com/iptv-org/database/master/data';
const PLAYLISTS = 'https://iptv-org.github.io/iptv';
const CDN_LIVE_TV = 'https://api.cdnlivetv.tv/api/v1';

const video = document.getElementById('video');
const placeholder = document.getElementById('placeholder');
const nowPlaying = document.getElementById('nowPlaying');
const npName = document.getElementById('npName');
const npFlag = document.getElementById('npFlag');
const sourceSelect = document.getElementById('sourceSelect');
const sportsSelect = document.getElementById('sportsSelect');
const searchInput = document.getElementById('search');
const channelList = document.getElementById('channelList');
const channelCount = document.getElementById('channelCount');
const tabs = document.getElementById('tabs');

let mode = 'country';
let countries = [];
let categories = [];
let channels = [];
let sportsEvents = [];
let activeChannel = null;
let hls = null;

const DEFAULT_PINS = [
  { name: 'beIN Sports AFC 1', url: 'https://iptv-org.github.io/channels/qa/beINSportsAFC1#SD', tvgId: 'beINSportsAFC1.qa@SD', country: 'qa' }
];

function getPins() {
  try {
    return JSON.parse(localStorage.getItem('abba_pins')) || DEFAULT_PINS;
  } catch { return DEFAULT_PINS; }
}

function savePins(pins) {
  localStorage.setItem('abba_pins', JSON.stringify(pins));
}

function openPinModal() {
  document.getElementById('addPinModal').style.display = 'flex';
}

function closePinModal() {
  document.getElementById('addPinModal').style.display = 'none';
  document.getElementById('pinNameInput').value = '';
  document.getElementById('pinUrlInput').value = '';
  document.getElementById('pinIdInput').value = '';
}

function addPin() {
  const name = document.getElementById('pinNameInput').value.trim();
  const url = document.getElementById('pinUrlInput').value.trim();
  const tvgId = document.getElementById('pinIdInput').value.trim();
  if (!name || !url) { alert('Channel name and URL are required.'); return; }
  const pins = getPins();
  pins.push({ name, url, tvgId: tvgId || '', country: '' });
  savePins(pins);
  closePinModal();
  if (mode === 'pins') renderPins();
}

function removePin(index) {
  const pins = getPins();
  pins.splice(index, 1);
  savePins(pins);
  if (mode === 'pins') renderPins();
  else renderChannels();
}

function parseCSV(text) {
  const lines = text.split('\n');
  const headers = parseCSVLine(lines[0]);
  const result = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = parseCSVLine(lines[i]);
    const row = {};
    headers.forEach((h, idx) => { row[h.trim()] = (vals[idx] || '').trim(); });
    result.push(row);
  }
  return result;
}

function parseCSVLine(line) {
  const out = []; let cur = ''; let q = false;
  for (const ch of line) {
    if (ch === '"') { q = !q; continue; }
    if (ch === ',' && !q) { out.push(cur); cur = ''; continue; }
    cur += ch;
  }
  out.push(cur);
  return out;
}

async function fetchCSV(path) {
  const res = await fetch(`${DB}/${path}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return parseCSV(await res.text());
}

async function init() {
  try {
    const [cRows, catRows] = await Promise.all([
      fetchCSV('countries.csv'),
      fetchCSV('categories.csv')
    ]);
    countries = cRows
      .filter(r => r.code && r.name)
      .map(r => ({ code: r.code.toLowerCase(), name: r.name, flag: r.flag }))
      .sort((a, b) => a.name.localeCompare(b.name));
    categories = catRows
      .filter(r => r.id && r.name)
      .map(r => ({ id: r.id, name: r.name }));
    populateSources();
  } catch (e) {
    sourceSelect.innerHTML = '<option value="">Failed to load data</option>';
    showState('error', '⚠️', 'Failed to load', 'Could not fetch data. Please refresh to try again.');
  }
}

function populateSources() {
  if (mode === 'country') {
    sourceSelect.innerHTML = '<option value="">Select a country...</option>' +
      countries.map(c => `<option value="${c.code}">${c.flag} ${c.name}</option>`).join('');
  } else {
    sourceSelect.innerHTML = '<option value="">Select a category...</option>' +
      categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
  }
  sourceSelect.value = '';
}

tabs.addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  tabs.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  mode = btn.dataset.mode;
  channels = [];
  sportsEvents = [];
  activeChannel = null;
  searchInput.value = '';
  document.getElementById('customLoader').style.display = 'none';
  sourceSelect.style.display = 'none';
  sportsSelect.style.display = 'none';
  document.getElementById('addPinBtn').style.display = 'none';
  if (mode === 'pins') {
    document.getElementById('addPinBtn').style.display = '';
    renderPins();
  } else if (mode === 'custom') {
    document.getElementById('customLoader').style.display = 'flex';
    showState('custom', '📦', 'Load a Custom Playlist', 'Paste an M3U URL above or pick a preset to load channels.');
    channelCount.textContent = '0';
  } else if (mode === 'sports') {
    sportsSelect.style.display = '';
    loadSportsEvents('all');
  } else {
    sourceSelect.style.display = '';
    document.getElementById('addPinBtn').style.display = '';
    populateSources();
    showWelcome();
    channelCount.textContent = '0';
  }
});

function showWelcome() {
  const icon = mode === 'country' ? '🌍' : '📂';
  const label = mode === 'country' ? 'country' : 'category';
  channelList.innerHTML = `
    <div class="state-msg">
      <div class="state-icon">${icon}</div>
      <div class="state-title">Browse by ${label}</div>
      <div class="state-sub">Select a ${label} from the dropdown above to load channels</div>
    </div>`;
}

function renderPins() {
  const pins = getPins();
  channelCount.textContent = `${pins.length}`;
  if (pins.length === 0) {
    showState('empty', '📌', 'No pinned channels', 'Add a custom stream using the ＋ button above.');
    return;
  }
  let html = '<div class="channel-grid">';
  pins.forEach((ch, idx) => {
    const isActive = activeChannel && ch.url === activeChannel.url;
    const ci = ch.country ? getCountryInfo(ch.country) : null;
    html += `<div class="channel${isActive ? ' active' : ''}" data-url="${attr(ch.url)}" data-name="${attr(ch.name)}" data-tvg-logo="">
      <div class="ch-logo"><div class="fallback">${escHtml(ch.name.charAt(0))}</div></div>
      <div class="ch-info">
        <div class="ch-name">${escHtml(ch.name)}</div>
        <div class="ch-meta">
          ${ci && ci.flag ? `<span class="flag">${ci.flag}</span>${escHtml(ci.name)}` : 'Pinned Stream'}
          <span class="ch-badge">📌</span>
        </div>
      </div>
      <button class="ch-play" onclick="event.stopPropagation();removePin(${idx})" title="Remove pin">✕</button>
    </div>`;
  });
  html += '</div>';
  channelList.innerHTML = html;
  channelList.querySelectorAll('.channel').forEach(el => {
    el.addEventListener('click', () => {
      playChannel(el.dataset.url, el.dataset.name, '');
    });
  });
}

function showState(type, icon, title, sub) {
  channelList.innerHTML = `
    <div class="state-msg">
      <div class="state-icon">${icon}</div>
      <div class="state-title">${title}</div>
      <div class="state-sub">${sub}</div>
    </div>`;
}

sourceSelect.addEventListener('change', async () => {
  const val = sourceSelect.value;
  if (!val) { showWelcome(); channelCount.textContent = '0'; return; }
  searchInput.value = '';
  await loadChannels(val);
});

searchInput.addEventListener('input', () => {
  if (mode === 'sports') renderSportsEvents();
  else renderChannels();
});

async function loadChannels(val) {
  channelList.innerHTML = '<div class="spinner"></div>';
  channels = [];
  activeChannel = null;

  const url = mode === 'country'
    ? `${PLAYLISTS}/countries/${val}.m3u`
    : `${PLAYLISTS}/categories/${val}.m3u`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    channels = parseM3U(text, val);
    renderChannels();
  } catch (e) {
    showState('error', '⚠️', 'Failed to load channels',
      `Could not fetch playlist for this ${mode}. It may not be available.`);
    channelCount.textContent = '0';
  }
}

function parseM3U(text, sourceId) {
  const lines = text.split('\n');
  const items = [];
  let current = null;
  for (const line of lines) {
    const t = line.trim();
    if (t.startsWith('#EXTINF:')) {
      current = { name: '', tvgId: '', tvgLogo: '', groupTitle: '', url: '' };
      const idM = t.match(/tvg-id="([^"]*)"/);
      if (idM) current.tvgId = idM[1];
      const logoM = t.match(/tvg-logo="([^"]*)"/);
      if (logoM) current.tvgLogo = logoM[1];
      const grpM = t.match(/group-title="([^"]*)"/);
      if (grpM) current.groupTitle = grpM[1];
      const commaIdx = t.lastIndexOf(',');
      if (commaIdx !== -1) current.name = t.substring(commaIdx + 1).trim();
    } else if (t && !t.startsWith('#') && current) {
      current.url = t;
      if (current.name) {
        current.country = sourceId;
        items.push(current);
      }
      current = null;
    }
  }
  return items;
}

function getCountryInfo(code) {
  if (!code) return null;
  const c = countries.find(c => c.code === code);
  if (c) return c;
  if (code.length === 2) return { code, name: code.toUpperCase(), flag: '' };
  return null;
}

function extractCountryCode(tvgId) {
  if (!tvgId) return null;
  const parts = tvgId.split('.');
  return parts.length > 1 ? parts[parts.length - 1].toLowerCase() : null;
}

function renderChannels() {
  const query = searchInput.value.toLowerCase().trim();
  const filtered = query
    ? channels.filter(c => c.name.toLowerCase().includes(query))
    : channels;

  const pins = mode !== 'pins' ? getPins() : [];
  const displayChannels = [...pins, ...filtered];
  const totalCount = filtered.length;

  channelCount.textContent = `${totalCount}`;

  if (displayChannels.length === 0) {
    const icon = query ? '🔍' : '📭';
    const title = query ? 'No results' : 'No channels';
    const sub = query ? `No channels match "${escHtml(query)}"` : 'This source has no channels available.';
    showState('empty', icon, title, sub);
    return;
  }

  let html = '<div class="channel-grid">';

  if (pins.length > 0 && !query) {
    for (const ch of pins) {
      const isActive = activeChannel && ch.url === activeChannel.url;
      const ci = ch.country ? getCountryInfo(ch.country) : null;
      html += `<div class="channel${isActive ? ' active' : ''} pinned" data-url="${attr(ch.url)}" data-name="${attr(ch.name)}" data-tvg-logo="">
        <div class="ch-logo"><div class="fallback">${escHtml(ch.name.charAt(0))}</div></div>
        <div class="ch-info">
          <div class="ch-name">${escHtml(ch.name)}</div>
          <div class="ch-meta">
            ${ci && ci.flag ? `<span class="flag">${ci.flag}</span>${escHtml(ci.name)}` : 'Pinned'}
          </div>
        </div>
        <button class="ch-play">▶</button>
      </div>`;
    }
  }

  for (const ch of filtered) {
    const isActive = activeChannel && ch.url === activeChannel.url;
    const ci = getCountryInfo(ch.country) || (ch.tvgId ? getCountryInfo(extractCountryCode(ch.tvgId)) : null);

    html += `<div class="channel${isActive ? ' active' : ''}" data-url="${attr(ch.url)}" data-name="${attr(ch.name)}" data-tvg-logo="${attr(ch.tvgLogo || '')}">
      <div class="ch-logo">
        ${ch.tvgLogo ? `<img src="${attr(ch.tvgLogo)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" onload="this.style.display='block';this.nextElementSibling.style.display='none'"><div class="fallback" style="display:none">${escHtml(ch.name.charAt(0))}</div>` : `<div class="fallback">${escHtml(ch.name.charAt(0))}</div>`}
      </div>
      <div class="ch-info">
        <div class="ch-name">${escHtml(ch.name)}</div>
        <div class="ch-meta">
          ${ci && ci.flag ? `<span class="flag">${ci.flag}</span>` : ''}
          ${ci ? escHtml(ci.name) : ''}
          ${ch.groupTitle ? `<span class="ch-badge cat-badge">${escHtml(ch.groupTitle)}</span>` : ''}
        </div>
      </div>
      <button class="ch-play">▶</button>
    </div>`;
  }
  html += '</div>';
  channelList.innerHTML = html;

  channelList.querySelectorAll('.channel').forEach(el => {
    el.addEventListener('click', () => {
      playChannel(el.dataset.url, el.dataset.name, el.dataset.tvgLogo);
    });
  });
}

function attr(s) { return s.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function playChannel(url, name, tvgLogo) {
  if (hls) { hls.destroy(); hls = null; }

  video.style.display = 'none';
  placeholder.style.display = 'flex';
  nowPlaying.classList.remove('playing');
  npFlag.textContent = '';

  const ci = countries.find(c => channels.some(ch => ch.url === url && ch.country === c.code));
  if (ci && ci.flag) npFlag.textContent = ci.flag;

  nowPlaying.querySelector('.np-label').textContent = 'Now Playing';
  npName.textContent = name;
  nowPlaying.classList.add('playing');

  if (url.endsWith('.m3u8')) {
    if (Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.style.display = 'block';
        placeholder.style.display = 'none';
        video.play().catch(() => {});
      });
      hls.on(Hls.Events.ERROR, (e, data) => {
        if (data.fatal) {
          nowPlaying.querySelector('.np-label').textContent = 'Error';
          npName.textContent = `Failed to play ${name}`;
          npName.style.color = 'var(--primary)';
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
      video.style.display = 'block';
      placeholder.style.display = 'none';
      video.play().catch(() => {});
    } else {
      nowPlaying.querySelector('.np-label').textContent = 'Error';
      npName.textContent = 'HLS not supported in this browser';
      return;
    }
  } else {
    video.src = url;
    video.style.display = 'block';
    placeholder.style.display = 'none';
    video.play().catch(() => {});
  }

  activeChannel = { url, name };
  document.querySelectorAll('.channel').forEach(el => {
    el.classList.toggle('active', el.dataset.url === url);
  });
}

async function loadCustomM3U(url) {
  channelList.innerHTML = '<div class="spinner"></div>';
  channels = [];
  activeChannel = null;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    channels = parseM3U(text, 'custom');
    renderChannels();
  } catch (e) {
    showState('error', '⚠️', 'Failed to load playlist', `Could not fetch M3U from the provided URL. Check the URL and try again.`);
    channelCount.textContent = '0';
  }
}

const SPORT_CATEGORIES = {
  all: 'All Sports',
  soccer: 'Soccer',
  nfl: 'NFL',
  nba: 'NBA',
  nhl: 'NHL'
};

async function loadSportsEvents(category) {
  channelList.innerHTML = '<div class="spinner"></div>';
  sportsEvents = [];
  activeChannel = null;

  const url = category === 'all'
    ? `${CDN_LIVE_TV}/events/sports/?user=cdnlivetv&plan=free`
    : `${CDN_LIVE_TV}/events/sports/${category}/?user=cdnlivetv&plan=free`;

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const key = Object.keys(data)[0];
    const eventsData = data[key];
    sportsEvents = [];
    for (const sportName of ['Soccer', 'NFL', 'NBA', 'NHL']) {
      if (Array.isArray(eventsData[sportName])) {
        eventsData[sportName].forEach(e => {
          e._sport = sportName;
          sportsEvents.push(e);
        });
      }
    }
    renderSportsEvents();
  } catch (e) {
    showState('error', '⚠️', 'Failed to load sports events', 'Could not fetch from CDN Live TV. Try again later.');
    channelCount.textContent = '0';
  }
}

function renderSportsEvents() {
  const query = searchInput.value.toLowerCase().trim();
  let filtered = sportsEvents;
  if (query) {
    filtered = sportsEvents.filter(e =>
      (e.homeTeam || '').toLowerCase().includes(query) ||
      (e.awayTeam || '').toLowerCase().includes(query) ||
      (e.tournament || '').toLowerCase().includes(query)
    );
  }
  channelCount.textContent = `${filtered.length}`;

  if (filtered.length === 0) {
    showState(query ? 'empty' : 'empty', query ? '🔍' : '⚽', query ? 'No results' : 'No events', query ? 'No events match your search' : 'No sports events found for this category.');
    return;
  }

  let html = '<div class="channel-grid">';
  for (const ev of filtered) {
    const isLive = ev.status === 'LIVE';
    const isFinished = ev.status === 'finished' || ev.status === 'FT' || ev.status === 'PST';
    const statusBadge = isLive
      ? '<span class="ch-badge" style="background:#22c55e;color:#fff">● LIVE</span>'
      : isFinished
      ? `<span class="ch-badge" style="background:var(--text3)">${ev.status}</span>`
      : `<span class="ch-badge" style="background:var(--accent-dim);color:#a78bfa">${ev.status || 'UPCOMING'}</span>`;

    const channelInfo = ev.channels && ev.channels.length > 0
      ? `<div style="font-size:11px;color:var(--text3);margin-top:4px">📡 ${ev.channels.map((ch, idx) =>
          `<a href="#" class="sports-ch-link" data-url="${attr(ch.url)}" data-name="${attr(ch.channel_name)}" data-event="${attr(ev.homeTeam + ' vs ' + ev.awayTeam)}" style="color:var(--primary);text-decoration:none;margin-right:4px" onclick="event.stopPropagation();playChannel('${attr(ch.url)}','${attr(ch.channel_name + ' - ' + ev.homeTeam + ' vs ' + ev.awayTeam)}','')">${escHtml(ch.channel_name)}</a>`
        ).join(', ')}</div>`
      : '';

    html += `<div class="channel" style="cursor:default;flex-direction:column;align-items:stretch">
      <div style="display:flex;align-items:center;gap:12px">
        <div class="ch-logo">
          <div class="fallback" style="font-size:11px">${ev.homeTeam ? ev.homeTeam.charAt(0) : '?'}</div>
        </div>
        <div class="ch-info">
          <div class="ch-name">${escHtml(ev.homeTeam || '')} vs ${escHtml(ev.awayTeam || '')}</div>
          <div class="ch-meta">
            ${ev.tournament ? `<span class="ch-badge cat-badge">${escHtml(ev.tournament)}</span>` : ''}
            ${statusBadge}
            <span class="ch-badge">${escHtml(ev._sport)}</span>
            ${ev.country ? `<span style="font-size:12px">${ev.countryIMG ? `<img src="${attr(ev.countryIMG)}" style="width:16px;height:12px;vertical-align:middle">` : ''} ${escHtml(ev.country)}</span>` : ''}
          </div>
          <div style="font-size:12px;color:var(--text2);margin-top:2px">${ev.time || ''} ${ev.start ? `· ${ev.start}` : ''}</div>
          ${channelInfo}
        </div>
      </div>
    </div>`;
  }
  html += '</div>';
  channelList.innerHTML = html;
}

document.getElementById('loadCustomBtn').addEventListener('click', () => {
  const url = document.getElementById('customUrlInput').value.trim();
  if (!url) return;
  loadCustomM3U(url);
});

document.getElementById('customUrlInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const url = e.target.value.trim();
    if (url) loadCustomM3U(url);
  }
});

document.getElementById('customPreset').addEventListener('change', e => {
  const url = e.target.value;
  if (!url) return;
  document.getElementById('customUrlInput').value = url;
  loadCustomM3U(url);
  e.target.value = '';
});

sportsSelect.addEventListener('change', () => {
  loadSportsEvents(sportsSelect.value);
});

window.openPinModal = openPinModal;
window.closePinModal = closePinModal;
